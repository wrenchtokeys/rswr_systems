{% extends "admin/base_site.html" %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<form method="post">
    {% csrf_token %}
    <p>You are about to reassign <strong>{{ item_count }}</strong> {{ item_type }}(s) to a new technician.</p>

    <div style="margin: 20px 0;">
        <label for="technician_id" style="font-weight: bold; display: block; margin-bottom: 5px;">
            Select technician:
        </label>
        <select name="technician_id" id="technician_id" style="padding: 6px 10px; min-width: 300px;">
            {% for tech in technicians %}
            <option value="{{ tech.id }}">{{ tech.user.get_full_name }} ({{ tech.user.email }})</option>
            {% empty %}
            <option value="" disabled>No active technicians available</option>
            {% endfor %}
        </select>
    </div>

    {% for item in items %}
    <input type="hidden" name="_selected_action" value="{{ item.pk }}">
    {% endfor %}
    <input type="hidden" name="action" value="{{ action }}">

    <div style="margin-top: 20px;">
        <input type="submit" name="apply" value="Reassign" class="default" style="padding: 6px 15px;">
        <a href="../" style="margin-left: 10px; padding: 6px 15px;">Cancel</a>
    </div>
</form>
{% endblock %}
