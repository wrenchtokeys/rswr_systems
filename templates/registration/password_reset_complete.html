{% extends "saas/base_public.html" %}

{% block title %}Password Reset Complete | RS Systems{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-green-100 rounded-xl flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-check-circle text-green-600 text-2xl"></i>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">Password reset complete!</h1>
            <p class="text-gray-500 mt-2">Your password has been successfully changed.</p>
        </div>

        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="space-y-4 text-center">
                <div class="bg-green-50 border border-green-200 rounded-lg p-4">
                    <p class="text-sm text-green-800">
                        <i class="fas fa-shield-alt mr-2"></i>
                        Your account is now secured with your new password.
                    </p>
                </div>

                <a href="{% url 'login' %}" class="inline-flex items-center justify-center w-full py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500 transition-colors press">
                    <i class="fas fa-sign-in-alt mr-2"></i>
                    Log in with new password
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
