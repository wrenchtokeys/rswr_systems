<!DOCTYPE html>
<html lang="en">
<head>
    <title>Link Expired | RS Systems</title>
    {% include "includes/head_assets.html" %}
    <style nonce="{{ csp_nonce }}">body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center">
        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
            <div class="w-20 h-20 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Link Unavailable</h1>
            <p class="text-gray-600 mb-6">{{ reason }}</p>
            <a href="/login/" class="inline-flex items-center px-6 py-3 bg-brand-600 text-white text-sm font-medium rounded-lg hover:bg-brand-700 transition-colors press">
                Log In to Customer Portal
            </a>
        </div>
    </div>
