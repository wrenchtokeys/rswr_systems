<!DOCTYPE html>
<html lang="en">
<head>
    <title>Repair Denied | RS Systems</title>
    {% include "includes/head_assets.html" %}
    <style nonce="{{ csp_nonce }}">body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full text-center">
        <div class="bg-white rounded-xl shadow-lg border border-gray-200 p-8">
            <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                <svg class="w-10 h-10 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-gray-900 mb-2">Repair Denied</h1>
            <p class="text-gray-600 mb-1">Repair #{{ repair.id }} — Unit {{ repair.unit_number }}</p>
            <p class="text-gray-500 text-sm mb-6">The technician has been notified of your decision.</p>
            <a href="/app/" class="inline-flex items-center px-6 py-2 border border-gray-300 text-gray-700 text-sm font-medium rounded-lg hover:bg-gray-50 transition-colors">
                Go to Customer Portal →
            </a>
        </div>
    </div>
</body>
</html>
