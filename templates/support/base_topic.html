{% extends "base_app.html" %}

{% block title %}{{ topic.title }} | Help | RS Systems{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto">
    <nav class="mb-6 text-sm" aria-label="Breadcrumb">
        <a href="{% url 'help_home' %}" class="text-blue-600 hover:text-blue-800 font-medium">
            <i class="fas fa-arrow-left text-xs mr-1.5"></i>All guides
        </a>
    </nav>

    <div class="mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">{{ topic.title }}</h1>
        <p class="text-gray-500">{{ topic.blurb }}</p>
    </div>

    <div class="mb-8">
        {% include "components/video_slot.html" with label=topic.video_label %}
    </div>

    <div class="space-y-6">
        {% block guide %}{% endblock %}
    </div>

    <div class="mt-10 pt-6 border-t border-gray-200 flex items-center justify-between">
        <a href="{% url 'help_home' %}" class="text-sm font-medium text-blue-600 hover:text-blue-800">
            <i class="fas fa-book-open text-xs mr-1.5"></i>More guides
        </a>
    </div>
</div>
{% endblock %}
